<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIGGER VIP | Command Center</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">TRIGGER <span>VIP</span></div>
            <nav>
                <span>Dashboard</span>
                <span>Bot Network</span>
                <span>Stress Test</span>
            </nav>
            <div class="user-info">ADMIN: <strong>TRIGGERBABA</strong> <span class="badge">VIP PRO</span></div>
        </header>

        <div class="stats-row">
            <div class="card">
                <p>NETWORK STATUS</p>
                <h3 class="text-green" id="netStatus">ONLINE</h3>
            </div>
            <div class="card">
                <p>ACTIVE BOTS</p>
                <h3 id="botCountDisplay">0/500</h3>
            </div>
            <div class="card">
                <p>TARGET SERVER</p>
                <h3 class="text-blue" id="targetDisplay">NONE</h3>
            </div>
            <div class="card">
                <p>LAST TPS</p>
                <h3 class="text-yellow">19.8</h3>
            </div>
        </div>

        <div class="main-grid">
            <div class="command-center">
                <h2>SYSTEM COMMAND CENTER</h2>
                <div class="input-group">
                    <input type="text" id="serverIp" placeholder="SERVER IP (play.sunucu.com)">
                    <input type="number" id="botAmount" placeholder="BOT COUNT (Max 500)">
                </div>
                <input type="text" id="globalMsg" placeholder="MESSAGE TO CHAT" class="full-width">
                
                <div class="button-group">
                    <button class="btn btn-blue" onclick="deployBots()">DEPLOY BOTS</button>
                    <button class="btn btn-red" onclick="startStress()">START STRESS TEST</button>
                    <button class="btn btn-gray" onclick="stopAll()">STOP ALL</button>
                    <button class="btn btn-green" onclick="sendMsg()">SEND GLOBAL MSG</button>
                </div>
            </div>

            <div class="console-box">
                <h3>LIVE SYSTEM CONSOLE [TRIGGER_VIP_v2.1]</h3>
                <div id="consoleLogs" class="logs">
                    <p class="log-system">[SYSTEM] Initializing handshake... SUCCESS.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
