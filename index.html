<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legacy Bots</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="bg-overlay"></div>

    <header class="navbar">
        <div class="logo">LEGACY<span>saldırı merkezi</span></div>
        <div class="developer-credits">Developed by: triggerbabaa & rextro</div>
    </header>

    <main class="container">
        <section class="hero-section">
            <h1 class="glitch-title">SUNUCU YÜKLEME PANELİ</h1>
            <p class="subtitle">Yüksek kapasiteli altyapı yükleme ve siber operasyon merkezi.</p>
        </section>

        <section class="panel-section">
            <div class="panel-card">
                <div class="panel-header">
                    <h2><i class="fas fa-microchip"></i> KONTROL PANELİ</h2>
                    <span class="status-indicator">SİSTEM HAZIR</span>
                </div>
                
                <form class="test-form">
                    <div class="input-group">
                        <label for="ip"><i class="fas fa-terminal"></i> HEDEF SUNUCU ADRESİ (IP / DOMAIN)</label>
                        <input type="text" id="ip" placeholder="play.example.com" required>
                    </div>

                    <div class="form-row">
                        <div class="input-group">
                            <label for="port"><i class="fas fa-plug"></i> PORT</label>
                            <input type="number" id="port" placeholder="25565" min="1" max="65535" required>
                        </div>
                        <div class="input-group">
                            <label for="bot-count"><i class="fas fa-robot"></i> BOT MİKTARI</label>
                            <input type="number" id="bot-count" placeholder="100" min="1" max="100000" required>
                        </div>
                    </div>

                    <!-- 1000522465.jpg Görselindeki Elektrikli/Neon OVERLOAD Butonu -->
                    <button type="submit" class="overload-btn">
                        <span class="btn-text">saldıryı başlat</span>
                        <div class="lightning-crack top-crack"></div>
                        <div class="lightning-crack bottom-crack"></div>
                    </button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>Interface Design by <strong>triggerbabaa & rextro</strong> &copy; 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
