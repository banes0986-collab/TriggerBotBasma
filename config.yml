settings:
  async-processing: true
  geyser-support: false
  send-alerts-to-operators: true
  kick-on-max-vl: true

punishments:
  commands:
    - "kick %player% &c[GrimAC] Unfair Advantage Detected"

alerts:
  console: true
  discord: false
  permission: "grim.alerts"
  cooldown-ms: 150

checks:
